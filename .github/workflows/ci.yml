name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Genera los tipos de rutas (RouteContext) antes de chequear
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test
      # Build sin secretos: la app compila en modo local.
      - run: npm run build
        env:
          NEXT_PUBLIC_GIFTLY_DATA_MODE: local
